# Local development stack only. NOT a production deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pms_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: pms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_app -d pms"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pms_app:change-me@db:5432/pms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
