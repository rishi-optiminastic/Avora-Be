# Production stack for a single Hetzner VPS.
#
# TLS is terminated by the Coolify proxy that sits in front of this stack; it
# forwards to the `api` service over the shared network. This compose no longer
# ships its own caddy - Coolify owns 80/443. For Coolify to reach `api`, the api
# service needs Coolify's routing labels + to share the proxy's network (set on
# the Coolify side, not here).
#
#   api (uvicorn)
#   ├── db        (self-hosted Postgres + named volume)
#   ├── migrate   (one-shot: alembic upgrade head, runs before api)
#   └── workers   ocr · eod · payroll · auto-checkout
#
# Build then start:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# All app containers share ONE image (avora-pms-api:latest), built once from the
# `api` service; the schedulers + migrate just re-run it with a different command.
# The OCR worker is a separate slim image (bundles Tesseract).
#
# The api port is not published to the host - the Coolify proxy reaches it on the
# internal `avora` network. Only db publishes a host port (see the db service).

# Shared config for every container that runs the FastAPI app image.
x-app-image: &app-image
  image: avora-pms-api:latest
  env_file: .env.prod
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks: [avora]

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # POSTGRES_* come from .env.prod. The password here MUST match the one inside
    # DATABASE_URL (also in .env.prod) — they describe the same database.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PG18+ images store data in a major-version subdir under
    # /var/lib/postgresql (not /data) — mount the parent per upstream guidance.
    volumes:
      - pgdata:/var/lib/postgresql
    # Publish on host :5434 so the Next.js frontend (Vercel / Better Auth via
    # Prisma) can reach this DB directly — external conns are forced through TLS +
    # scram + the least-priv `fe_app` role (see pg_hba in the pgdata volume + ufw).
    # DO NOT REMOVE: the FE's DATABASE_URL points here; dropping it 500s all auth.
    # Host port: 5432 is the native postgres on loopback, and 5433 is taken by a
    # Coolify service on this shared box — so we use 5434. Override with the
    # PG_HOST_PORT env var if it ever clashes again.
    ports:
      - "${PG_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [avora]

  # One-shot: bring the schema to head BEFORE the api/workers start. Exits 0 on
  # success; `service_completed_successfully` gates everything else on that.
  migrate:
    image: avora-pms-api:latest
    env_file: .env.prod
    # `heads` (plural), not `head`: if two feature branches each add a migration
    # off the same parent (a fork), `head` is ambiguous and aborts the whole
    # deploy (exit 255). `heads` applies every branch tip, so a fork never takes
    # prod down — merge migrations then collapse the DAG back to one head.
    command: ["alembic", "upgrade", "heads"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks: [avora]

  api:
    <<: *app-image
    # The ONLY service with a build section — it produces avora-pms-api:latest,
    # which every other app container reuses. Context is the backend root (..).
    build:
      context: ..
      dockerfile: Dockerfile
    # Single uvicorn process on purpose: the rate limiter is in-process, so
    # multiple workers wouldn't share its buckets. Scale out later with Redis.
    # (Default CMD in the image already runs uvicorn on 0.0.0.0:8000.)
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler-eod:
    <<: *app-image
    command: ["python", "-m", "worker.eod_scheduler"]

  scheduler-payroll:
    <<: *app-image
    command: ["python", "-m", "worker.payroll_scheduler"]

  scheduler-autocheckout:
    <<: *app-image
    command: ["python", "-m", "worker.auto_checkout_scheduler"]

  # Standalone slim image (Tesseract). Talks to Postgres + S3 directly; no app
  # code, so it only needs db (not migrate). Reads DATABASE_URL + AWS_* from env.
  worker-ocr:
    build:
      context: ../worker
      dockerfile: Dockerfile
    image: avora-ocr-worker:latest
    env_file: .env.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [avora]

networks:
  avora:
    driver: bridge

volumes:
  pgdata:
