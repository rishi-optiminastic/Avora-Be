# Auto-deploy the backend to the Hetzner VPS on every push to main.
#
# Flow: checkout -> rsync the repo to /opt/avora/be on the VPS -> rebuild images
# -> `up -d` (the one-shot `migrate` runs `alembic upgrade head` first, then api
# AND the schedulers/ocr worker restart onto the new image). TLS is terminated by
# the Coolify proxy, not this stack, so there is no caddy service to restart. The
# server's secrets file (deploy/.env.prod) is NEVER touched by CI - it lives only
# on the VPS and is excluded from the sync.
#
# One-time setup — add these in GitHub:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     VPS_SSH_KEY   the PRIVATE key whose public half is in the VPS's
#                   authorized_keys (the deploy key created during setup;
#                   `cat ~/.ssh/avora_deploy` on the Mac that deployed).
#     VPS_HOST      65.21.186.55
#     VPS_USER      root
#
# The `up -d` at the bottom lists every service (api, all schedulers, ocr) so a
# deploy actually restarts the workers onto the new image — a bare subset leaves
# the schedulers running stale code. Add any new service to that line.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Missing required secret(s). In repo Settings -> Secrets and variables -> Actions -> Repository secrets, set VPS_HOST, VPS_USER, VPS_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # accept-new on the later ssh/rsync handles host key; keyscan is best-effort.
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync code to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache' \
            --exclude '.ruff_cache' \
            --exclude '.pytest_cache' \
            --exclude 'tests' \
            --exclude 'deploy/.env.prod' \
            --exclude 'deploy/backups' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/avora/be/"

      - name: Build & restart on VPS
        # No shell variables in the remote command — the VPS login shell is zsh,
        # which doesn't word-split them. Repeat the full compose invocation.
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/avora/be/deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod build && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate db migrate api scheduler-eod scheduler-payroll scheduler-autocheckout worker-ocr && docker compose -f docker-compose.prod.yml --env-file .env.prod ps'
